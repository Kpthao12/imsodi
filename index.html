<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For you 💜</title>
<style>
  :root{
    --bg1:#f3ecfb; --bg2:#e6d9f7;
    --card:#fdfaff; --border:#c9b3ec;
    --ink:#6b4fa3; --ink-soft:#8a76b3;
    --btn:#cdb8f0; --btn-hover:#bba1ea; --btn-border:#9d82d1;
    --shadow:0 18px 40px rgba(124,92,180,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Courier New",Courier,monospace;
    background:radial-gradient(circle at 20% 15%,#fbf7ff 0,transparent 45%),
               radial-gradient(circle at 85% 85%,#efe3ff 0,transparent 40%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow-x:hidden;padding:24px;
  }
  #petals{position:fixed;inset:0;pointer-events:none;z-index:0}
  .card{
    position:relative;z-index:1;
    width:min(380px,92vw);
    background:var(--card);
    border:3px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:28px 26px 30px;
    text-align:center;
    animation:pop .5s cubic-bezier(.2,1.4,.4,1);
  }
  .card.wide{width:min(460px,94vw)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .pic{
    width:170px;height:170px;margin:0 auto 18px;border-radius:12px;
    background:linear-gradient(160deg,#efe4fd,#dccbf6);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    position:relative;box-shadow:inset 0 0 0 2px #e2d3f8;
  }
  .pic .label{position:absolute;top:10px;left:10px;font-family:system-ui,sans-serif;
    font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(80,50,130,.6);font-weight:600}
  #question{font-size:clamp(14px,4.3vw,19px)!important;line-height:1.6}
  h1{font-size:22px;font-weight:normal;line-height:1.4;letter-spacing:.5px;margin-bottom:20px}
  .btns{position:relative;min-height:130px;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  button{
    font-family:inherit;font-weight:bold;font-size:13px;color:var(--ink);
    background:var(--btn);border:2px solid var(--btn-border);border-radius:7px;
    padding:7px 20px;cursor:pointer;transition:background .2s,transform .15s;
  }
  button:hover{background:var(--btn-hover);transform:translateY(-1px)}
  button:active{transform:translateY(1px)}
  #noBtn,#yesBtn{font-size:17px;padding:11px 34px;border-radius:9px}
  #noBtn{background:#fff;color:var(--ink);border-color:var(--btn-border);transition:left .25s ease,top .25s ease}
  #noBtn.runaway{position:fixed;z-index:5}
  #yesBtn{transition:transform .25s ease;transform-origin:center top}
  .letter{text-align:left;font-size:13px;line-height:1.75;color:#5d4a86;margin:4px 0 22px;white-space:pre-line}
  .stack{display:flex;flex-direction:column;align-items:center;gap:10px}
  .stack button{min-width:170px;padding:9px 20px}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:14px;min-height:14px}
  .hidden{display:none!important}
  .float{animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  /* customize modal */
  .modal{position:fixed;inset:0;background:rgba(90,60,140,.25);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
  .modal .card{width:min(440px,94vw);text-align:left}
  .modal label{display:block;font-size:12px;font-weight:bold;margin:12px 0 5px}
  .modal input,.modal textarea{width:100%;font-family:inherit;font-size:13px;color:#5d4a86;
    border:2px solid #dccbf6;border-radius:8px;padding:8px 10px;background:#fff;outline:none}
  .modal input:focus,.modal textarea:focus{border-color:var(--btn-border)}
  .modal textarea{height:150px;resize:vertical;line-height:1.5}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<canvas id="petals"></canvas>

<!-- Screen 1: question -->
<div class="card" id="askCard">
  <div class="pic float" id="askPic"></div>
  <h1 id="question">Min An cho Tĩn xin lũi<br>Tĩn biết Tĩn sai rùi ạ T^T</h1>
  <div class="btns" id="btns">
    <button id="yesBtn" class="hidden">Yes</button>
    <button id="noBtn">No</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<!-- Screen 2: forgiven -->
<div class="card wide hidden" id="yayCard">
  <div class="pic float" id="yayPic"></div>
  <h1 style="font-size:clamp(16px,4.6vw,20px)">HEHE IEM CẢM ƠN MIN AN<br>ĐÃ THA LŨI CHO IEM 💜</h1>
  <p class="letter" id="letter"></p>
  <div class="stack">
    <button id="restartBtn">Start Over ✦</button>
  </div>
</div>

const photo=k=>`<img src="${PHOTOS[k]}" alt="" style="width:100%;height:100%;object-fit:cover">`;

const $ = id => document.getElementById(id);
const askCard=$("askCard"), yayCard=$("yayCard"), yesBtn=$("yesBtn"), noBtn=$("noBtn"),
      hint=$("hint"), question=$("question");

function applySettings(){
  document.querySelectorAll(".nick").forEach(n=>n.textContent=settings.nick);
  $("letter").textContent=settings.message;
}

/* ---------- state ---------- */
let stage=0, dodges=0;
const lines=["nice try 😼","nope, wrong button","you can't catch me","just press yes 🥺","pretty please?","I'll buy you snacks","ok I'll keep running","💜 yes is right there 💜"];

function reset(){
  stage=0; dodges=0;
  $("askPic").innerHTML=photo("sad");
  question.innerHTML=`Min An cho Tĩn xin lũi<br>Tĩn biết Tĩn sai rùi ạ T^T`;
  yesBtn.classList.add("hidden"); yesBtn.style.transform="";
  noBtn.classList.remove("runaway"); noBtn.style.left=noBtn.style.top="";
  hint.textContent="";
  applySettings();
  yayCard.classList.add("hidden"); askCard.classList.remove("hidden");
  askCard.style.animation="none"; void askCard.offsetWidth; askCard.style.animation="";
}

// First click on "No": cat gets sad, "Yes" appears
noBtn.addEventListener("click",e=>{
  if(stage===0){
    stage=1;
    
    
    yesBtn.classList.remove("hidden");
    askCard.classList.remove("shake"); void askCard.offsetWidth; askCard.classList.add("shake");
    burst(window.innerWidth/2, window.innerHeight/2, 25, true);
  } else { dodge(); }
});

// After that, "No" runs away
function dodge(){
  if(stage!==1) return;
  const r=noBtn.getBoundingClientRect();
  if(!noBtn.classList.contains("runaway")){
    noBtn.style.left=r.left+"px"; noBtn.style.top=r.top+"px";
    noBtn.classList.add("runaway");
  }
  const pad=20, w=r.width, h=r.height;
  let x,y,tries=0;
  do{
    x=pad+Math.random()*(window.innerWidth-w-pad*2);
    y=pad+Math.random()*(window.innerHeight-h-pad*2);
    tries++;
  }while(Math.hypot(x-r.left,y-r.top)<140 && tries<30);
  noBtn.style.left=x+"px"; noBtn.style.top=y+"px";
  hint.textContent=lines[dodges%lines.length];
  dodges++;
  yesBtn.style.transform=`scale(${Math.min(1+dodges*0.12,2.2)})`;
}
noBtn.addEventListener("mouseenter",dodge);
noBtn.addEventListener("touchstart",e=>{ if(stage===1){e.preventDefault();dodge();} },{passive:false});
document.addEventListener("mousemove",e=>{
  if(stage!==1||!noBtn.classList.contains("runaway")) return;
  const r=noBtn.getBoundingClientRect();
  if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<70) dodge();
});

yesBtn.addEventListener("click",()=>{
  stage=2;
  noBtn.classList.remove("runaway"); noBtn.style.left=noBtn.style.top="";
  askCard.classList.add("hidden");
  $("yayPic").innerHTML=photo("happy");
  applySettings();
  yayCard.classList.remove("hidden");
  yayCard.style.animation="none"; void yayCard.offsetWidth; yayCard.style.animation="";
  for(let i=0;i<4;i++) setTimeout(()=>burst(Math.random()*innerWidth, innerHeight*0.3+Math.random()*innerHeight*0.3, 60),i*220);
});

$("restartBtn").addEventListener("click",reset);

/* ---------- petals & confetti ---------- */
const cv=$("petals"), ctx=cv.getContext("2d");
const colors=["#c9a7ef","#e3c8ff","#f3b6d8","#b89be6","#d7c2f7","#f8d4ea"];
let parts=[];
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",resize); resize();

function petal(){return{x:Math.random()*innerWidth,y:-20,vx:(Math.random()-.5)*.6,vy:.5+Math.random()*1,
  s:3+Math.random()*3,r:(Math.random()-.5)*.6,vr:(Math.random()-.5)*.02,c:colors[Math.random()*colors.length|0],life:Infinity,heart:true}}
function burst(x,y,n,gentle){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(gentle?2:4)+Math.random()*(gentle?3:6);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,s:3+Math.random()*3,r:(Math.random()-.5)*.8,
      vr:(Math.random()-.5)*.15,c:colors[Math.random()*colors.length|0],life:120+Math.random()*60,g:.12,heart:true});}
}
function drawHeart(s){ctx.beginPath();ctx.moveTo(0,s*.35);
  ctx.bezierCurveTo(-s*1.2,-s*.5,-s*.4,-s*1.2,0,-s*.45);
  ctx.bezierCurveTo(s*.4,-s*1.2,s*1.2,-s*.5,0,s*.35);ctx.fill()}
function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  if(Math.random()<.08 && parts.filter(p=>p.life===Infinity).length<40) parts.push(petal());
  parts=parts.filter(p=>p.y<innerHeight+30&&p.life>0);
  for(const p of parts){
    if(p.g){p.vy+=p.g;p.vx*=.99;p.life--} else {p.vx+=Math.sin(p.y/40)*.02}
    p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    ctx.globalAlpha=p.life===Infinity?.75:Math.min(1,p.life/40);
    if(p.heart) drawHeart(p.s*1.4); else {ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.6,0,0,Math.PI*2);ctx.fill()}
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
loop();
reset();
</script>
